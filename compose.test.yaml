services:
  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: call-order-db-test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d call-order-db-test']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile

    environment:
      NODE_ENV: test

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: call-order-db-test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    depends_on:
      postgres:
        condition: service_healthy
